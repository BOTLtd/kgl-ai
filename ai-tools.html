<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KGL AI | AI Solutions Marketplace</title>

<meta name="description" content="KGL AI AI Solutions Marketplace">

<link rel="icon" href="image/kgl-ai-logo.png">


<script src="https://cdn.tailwindcss.com"></script>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>

body{
font-family:'Inter',sans-serif;
}


.card-hover{
transition:.3s;
}


.card-hover:hover{
transform:translateY(-6px);
}


</style>


</head>


<body class="bg-gray-50">



<!-- HEADER -->
<header class="bg-white shadow-sm sticky top-0 z-50">

<div class="max-w-7xl mx-auto p-4 flex justify-between items-center">


<!-- Logo -->

<a href="index.html" class="flex items-center gap-3">

<img src="image/kgl-ai-logo.png"
alt="KGL AI Logo"
class="h-24 md:h-24 w-auto object-contain"
onerror="this.style.display='none'" />

</a>



<!-- Navigation -->

<nav class="space-x-6 text-gray-700 font-medium hidden md:block">


<a href="index.html"
class="hover:text-indigo-600 transition">

Home

</a>


<a href="solutions.html"
class="hover:text-indigo-600 transition">

Spaces

</a>


<a href="services.html"
class="hover:text-indigo-600">

Services

</a>


<a href="career.html"
class="hover:text-indigo-600 transition">

Career

</a>



</nav>


</div>

</header>





<!-- MARKETPLACE HERO -->


<section class="bg-gradient-to-r from-indigo-600 to-cyan-500 text-white py-12">


<div class="max-w-7xl mx-auto px-6 text-center">


<h1 class="text-4xl font-extrabold mb-3">

🌍 AI Solutions Marketplace

</h1>


<p class="text-lg">

Discover AI solutions solving healthcare, education, business and community challenges.

</p>



<div class="mt-8 flex flex-col md:flex-row justify-center gap-4">


<input

id="searchInput"

type="text"

placeholder="Search AI solutions..."

class="px-5 py-3 rounded-lg text-gray-800 w-full md:w-96"

>



<select

id="categoryFilter"

class="px-5 py-3 rounded-lg text-gray-800">


<option value="all">

All Categories

</option>


<option value="health">
Health
</option>


<option value="education">
Education
</option>


<option value="business">
Business
</option>


<option value="agriculture">
Agriculture
</option>


<option value="fintech">
Fintech
</option>


<option value="environment">
Environment
</option>


<option value="creative">
Creative
</option>


<option value="security">
Security
</option>


</select>


</div>


</div>


</section>







<!-- PROJECT CARDS -->


<main class="max-w-7xl mx-auto px-6 py-10">


<div
    id="cardContainer"
    class="grid gap-6"
    style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));">
</div>


</main>






<script>


const images={

health:"https://source.unsplash.com/400x300/?health",

education:"https://source.unsplash.com/400x300/?education",

business:"https://source.unsplash.com/400x300/?business",

agriculture:"https://source.unsplash.com/400x300/?farming",

fintech:"https://source.unsplash.com/400x300/?finance",

environment:"https://source.unsplash.com/400x300/?environment",

creative:"https://source.unsplash.com/400x300/?design",

security:"https://source.unsplash.com/400x300/?security"

};




// KEEP YOUR CURRENT CARDS ARRAY HERE

const cards=[

{
title:"AI Symptom Checker",
category:"health",
problem:"People unsure when to seek care",
solution:"AI analyzes symptoms instantly",
impact:"Early diagnosis",
image:images.health
},


{
title:"Telemedicine AI Assistant",
category:"health",
problem:"Limited doctor access",
solution:"AI triage and booking",
impact:"Faster healthcare",
image:images.health
},


{
title:"Mental Health Chatbot",
category:"health",
problem:"Stress and anxiety",
solution:"AI emotional support",
impact:"Improved wellbeing",
image:images.health
},


{
title:"AI Nutrition Planner",
category:"health",
problem:"Poor diet planning",
solution:"Personalized meal AI",
impact:"Better health",
image:images.health
},


{
title:"Disease Prediction AI",
category:"health",
problem:"Late diagnosis",
solution:"Predict illness risk",
impact:"Preventive care",
image:images.health
}


];





const paidProjects=[

"AI Symptom Checker",

"Telemedicine AI Assistant",

"Mental Health Chatbot",

"AI Nutrition Planner",

"Disease Prediction AI"

];




const container=document.getElementById("cardContainer");




function displayCards(data){


container.innerHTML="";


data.forEach(card=>{


let buy="";


if(paidProjects.includes(card.title)){


buy=`

<a href="https://b-pay.vercel.app/"

target="_blank"

class="bg-green-600 hover:bg-green-700 text-white text-center px-3 py-2 rounded-lg font-semibold">

Buy Now

</a>

`;

}



container.innerHTML+=`


<div class="bg-white rounded-xl shadow-lg overflow-hidden card-hover">


<img src="${card.image}"

class="w-full h-44 object-cover">


<div class="p-5">


<span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">

${card.category}

</span>


<h2 class="text-xl font-bold mt-3">

${card.title}

</h2>



<p class="text-sm mt-3">

<b>Problem:</b> ${card.problem}

</p>



<p class="text-sm mt-2">

<b>Solution:</b> ${card.solution}

</p>



<p class="text-sm mt-2 mb-4">

<b>Impact:</b> ${card.impact}

</p>



<div class="space-y-3">

<div class="grid grid-cols-2 gap-2">

<button
class="bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition">
Free Trial
</button>

${paidProjects.includes(card.title) ? `
<a
href="https://b-pay.vercel.app/"
target="_blank"
class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold text-center flex items-center justify-center transition">
Buy Now
</a>
` : `
<div></div>
`}

</div>

<button
class="w-full border border-gray-300 hover:bg-gray-100 py-2 rounded-lg font-semibold transition">
Explore
</button>

</div>



</div>


</div>


`;


});


}





function filterCards(){


let search=document
.getElementById("searchInput")
.value
.toLowerCase();


let category=document
.getElementById("categoryFilter")
.value;



let result=cards.filter(c=>


c.title.toLowerCase().includes(search)

&&

(category==="all" || c.category===category)


);


displayCards(result);


}



document
.getElementById("searchInput")
.addEventListener("input",filterCards);



document
.getElementById("categoryFilter")
.addEventListener("change",filterCards);



displayCards(cards);



</script>


</body>

</html>
